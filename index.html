<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chesster — Шахи проти читера</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="game-container">
    <h1>Chesster</h1>
    <div id="status" class="status">Твій хід (Білі)</div>
    <div id="cheatBanner" class="cheat-banner hidden"></div>
    
    <div class="board-wrapper">
        <div class="board-wrapper">
      <div id="materialBar" class="material-bar hidden">Матеріал: 0</div>
      <div class="board-stage">
        <div id="board" class="board theme-slate"></div>
        <div id="boardOverlay" class="board-overlay"></div>
      </div>
    </div>

        <button id="menuBtn" class="btn menu-btn hidden">Перейти в меню</button>

       <button id="restartBtn" class="btn">Почати партію</button>
        <button id="settingsBtn" class="settings-btn" title="Налаштування">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ Налаштування гри</h2>
        <button id="closeSettingsBtn" class="close-btn">✕</button>
      </div>

      <div class="setting-group">
        <label for="difficultySelect">Складність гри (Розум бота):</label>
        <select id="difficultySelect">
          <option value="easy">Новачок (Простий)</option>
          <option value="medium" selected>Любитель (Тактичний)</option>
          <option value="hard">Профі (Minimax — Глибокий розрахунок)</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="cheatLevelSelect">Рівень читера:</label>
        <select id="cheatLevelSelect">
          <option value="0">0 — Чесна гра (Без чітів)</option>
          <option value="1" selected>1 — Хитрий (Суперходи фігур)</option>
          <option value="2">2 — Нахабний (Пробивання та ривок пішака)</option>
          <option value="3">3 — Неможливий (Абсолютний злом)</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="themeSelect">Тема дошки:</label>
        <select id="themeSelect">
          <option value="slate" selected>Сучасна (Сіро-біла)</option>
          <option value="bw">Чорно-біла (Монохром)</option>
          <option value="green">Турнірна (Зелена)</option>
          <option value="wood">Класична (Дерево)</option>
          <option value="ocean">Океан (Синьо-блакитна)</option>
          <option value="crimson">Лігво читера (Червоно-темна)</option>
          <option value="purple">Аметист (Фіолетова)</option>
          <option value="cyber">Кіберпанк (Неонова)</option>
          <option value="DarkWood">Темний дуб</option>
          <option value="acacia">Акація</option>
          <option value="birch">Береза</option>
          <option value="fire">Пламя</option>
<option value="grass">Трава</option>

        </select>
      </div>

      <div class="setting-group">
        <label for="moveAnimSelect">Рух фігур:</label>
        <select id="moveAnimSelect">
          <option value="smooth" selected>Плавно</option>
          <option value="instant">Різко</option>
          <option value="step">По клітинці</option>
        </select>
      </div>

      <div class="setting-group">
        <label for="captureAnimSelect">Взяття фігури:</label>
        <select id="captureAnimSelect">
          <option value="fade" selected>Плавно зникає</option>
          <option value="instant">Різко зникає</option>
        </select>
      </div>

      <div class="setting-group checkbox-group">
        <input type="checkbox" id="showHintsCheck" checked>
        <label for="showHintsCheck">Показувати підказки ходів</label>
      </div>

      <div class="setting-group checkbox-group">
        <input type="checkbox" id="showMaterialCheck">
        <label for="showMaterialCheck">Показувати матеріал</label>
      </div>

      <div class="setting-group checkbox-group">
        <input type="checkbox" id="trashTalkCheck">
        <label for="trashTalkCheck">Повідомлення читера під час злому</label>
      </div>

      <button id="applySettingsBtn" class="btn full-width">Застосувати та закрити</button>
    </div>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
